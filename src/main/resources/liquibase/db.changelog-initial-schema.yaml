databaseChangeLog:
  - changeSet:
      id: init-sequences
      author: nwu1015
      changes:
        - createSequence:
            sequenceName: category_seq
            incrementBy: 50
        - createSequence:
            sequenceName: product_seq
            incrementBy: 50
        - createSequence:
            sequenceName: order_seq
            incrementBy: 50
        - createSequence:
            sequenceName: order_item_seq
            incrementBy: 50

  - changeSet:
      id: create-tables
      author: nwu1015
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_items_order

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_items_product

  - changeSet:
      id: add-constraints-indexes
      author: nwu1015
      changes:
        - addUniqueConstraint:
            tableName: products
            columnNames: category_id, name
            constraintName: uq_product_name_per_category

        - createIndex:
            tableName: products
            indexName: idx_product_name
            columns:
              - column:
                  name: name

        - createIndex:
            tableName: products
            indexName: idx_product_category
            columns:
              - column:
                  name: category_id
  - changeSet:
      id: add-order-natural-id
      author: nwu1015
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true